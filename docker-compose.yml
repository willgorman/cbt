version: '3.8'

# Docker Compose configuration for SINGLE-HOST deployment
# All containers (head + clients) run on the same host
# For MULTI-HOST deployment, use docker-compose.head.yml and docker-compose.client.yml
# See docker/README.md for multi-host deployment guide

services:
  # Head node - where CBT commands are executed
  cbt-head:
    build: .
    image: cbt:latest
    container_name: cbt-head
    hostname: cbt-head
    networks:
      - cbt-network
    volumes:
      # Mount Ceph configuration from host
      - ${CEPH_CONF_DIR:-./ceph-config}:/etc/ceph:ro
      # Mount SSH keys for passwordless access to clients
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
      # Mount archive directory for results
      - ${ARCHIVE_DIR:-./archive}:/cbt/archive
      # Mount test configurations
      - ${CONFIG_DIR:-./configs}:/cbt/configs:ro
    command: tail -f /dev/null  # Keep container running

  # Client node 1
  cbt-client-1:
    build: .
    image: cbt:latest
    container_name: cbt-client-1
    hostname: cbt-client-1
    networks:
      - cbt-network
    volumes:
      # Mount Ceph configuration from host
      - ${CEPH_CONF_DIR:-./ceph-config}:/etc/ceph:ro
      # Mount SSH keys
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    # Enable privilege mode for block device operations
    privileged: true
    command: |
      bash -c '
        # Start SSH daemon for remote command execution
        mkdir -p /run/sshd
        /usr/sbin/sshd -D
      '

  # Client node 2 (optional - can be scaled)
  cbt-client-2:
    build: .
    image: cbt:latest
    container_name: cbt-client-2
    hostname: cbt-client-2
    networks:
      - cbt-network
    volumes:
      - ${CEPH_CONF_DIR:-./ceph-config}:/etc/ceph:ro
      - ${SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    privileged: true
    command: |
      bash -c '
        mkdir -p /run/sshd
        /usr/sbin/sshd -D
      '

networks:
  cbt-network:
    driver: bridge
